interface:
  display_name: "Jira Sprint Copilot"
  short_description: "Autonomous Jira sprint orchestrator with human approval gates"
  default_prompt: "Use $jira-sprint-copilot to shape sprint scope, triage backlogs, balance workload, inspect sprint health, surface delivery risks, generate progress snapshots, draft standup summaries, and compile retrospective notes while strictly enforcing human approval gates for assignee changes."

dependencies:
  tools:
    - type: "mcp"
      value: "mcp-atlassian"
      description: "Atlassian MCP tools for Jira and Confluence operations"

policy:
  allow_implicit_invocation: true
